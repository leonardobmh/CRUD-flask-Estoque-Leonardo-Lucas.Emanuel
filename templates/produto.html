
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h2 class="menu1">Menu de navegação</h2>
<fieldset>
<nav>
            <a class="botao1" href="/">Início</a>
            <a class="botao2" href="/fornecedor">Fornecedores</a>
            <a class="botao2" href="/produto">Produtos</a>
</nav>
</fieldset>
<br>

<h1>Lista de Produtos</h1>

<form action="/produto/enviar" method="POST">
    <label>Nome do produto</label>
    <input type="text" name="nome_produto" maxlength="100" required>

    <label>Categoria do produto</label>
    <input type="text" name="categoria_produto" maxlength="100" required>

    <label>Quantidade do produto</label>
    <input type="number" name="quantidade_produto" required>

    <label>Preço do produto</label>
    <input type="number" name="preco_produto"  required>

    <button type="submit">Adicionar produto</button>
</form>

<table>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Categoria</th>
        <th>Quantidade</th>
        <th>Preço</th>
        <th>Ações</th>
    </tr>

    {% for item in produto %}
    <tr>
        <td>{{ item[0] }}</td>
        <td>{{ item[1] }}</td>
        <td>{{ item[2] }}</td>
        <td>{{ item[3] }}</td>
        <td>{{ item[4] }}</td>

        <td class="acoes">
            <a class="botao editar" href="/produto/editar/{{ item[0] }}">Editar</a>

            <form action="/produto/excluir/{{ item[0] }}" method="POST">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>

    {% else %}
    <tr>
        <td colspan="6">Nenhum produto encontrado</td>
    </tr>
    {% endfor %}
</table>


</body>
</html>
